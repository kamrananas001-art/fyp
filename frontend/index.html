<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Welcome Back</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0a0b14',
                        card: '#11121d',
                        accent: '#2563eb',
                        input: '#1a1b26',
                        muted: '#94a3b8'
                    }
                }
            }
        }
    </script>
</head>
<body class="gradient-bg min-h-screen text-white">
    <!-- Navbar -->
    <nav class="flex items-center justify-between px-8 py-6 max-w-7xl mx-auto z-50 relative">
        <a href="index.html" class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-accent rounded-lg flex items-center justify-center">
                <i class="fas fa-robot text-white"></i>
            </div>
            <span class="text-xl font-bold tracking-tight">AI Assistant</span>
        </a>
        
        <!-- Mobile Menu Toggle -->
        <button class="md:hidden text-white" onclick="toggleMobileMenu()">
            <i class="fas fa-bars text-xl"></i>
        </button>

        <!-- Nav Links -->
        <div id="nav-links" class="hidden md:flex items-center space-x-8 text-sm font-medium absolute md:relative top-full left-0 right-0 bg-dark md:bg-transparent p-6 md:p-0 border-b border-slate-800 md:border-none">
            <a href="docs.html" class="block md:inline text-muted hover:text-white transition mb-4 md:mb-0">Documentation</a>
            <a href="pricing.html" class="block md:inline text-muted hover:text-white transition mb-6 md:mb-0">Pricing</a>
            <a href="signup.html" class="block md:inline-block bg-accent/10 text-accent px-4 py-2 rounded-lg hover:bg-accent hover:text-white transition border border-accent/20 text-center">Sign Up</a>
        </div>
    </nav>

    <main class="mt-8">
        <div class="fade-in flex flex-col items-center justify-center px-4">
            <div class="w-full max-w-md glass-card rounded-2xl p-8 md:p-10 text-center">
                <h1 class="text-3xl font-bold mb-2">Welcome Back</h1>
                <p class="text-muted text-sm mb-8">Continue your journey with your AI companion</p>

                <!-- Social Logins -->
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <button class="flex items-center justify-center space-x-2 bg-input border border-slate-800 py-3 rounded-xl hover:bg-slate-800 transition">
                        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5" alt="Google">
                        <span class="text-sm font-medium">Google</span>
                    </button>
                    <button class="flex items-center justify-center space-x-2 bg-input border border-slate-800 py-3 rounded-xl hover:bg-slate-800 transition">
                        <i class="fab fa-github text-xl"></i>
                        <span class="text-sm font-medium">GitHub</span>
                    </button>
                </div>

                <div class="relative flex items-center justify-center mb-8">
                    <div class="border-t border-slate-800 w-full"></div>
                    <span class="absolute bg-card px-4 text-[10px] text-muted tracking-widest font-bold uppercase">Or continue with email</span>
                </div>

                <!-- Login Form -->
                <form class="space-y-6 text-left" onsubmit="window.signInAction(event)">
                    <div>
                        <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2 ml-1">Email Address</label>
                        <div class="relative">
                            <i class="far fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-muted"></i>
                            <input type="email" placeholder="name@company.com" required class="w-full bg-input border border-slate-800 rounded-xl py-3.5 pl-11 pr-4 text-sm focus:outline-none focus:border-accent transition">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-semibold text-muted uppercase tracking-wider ml-1">Password</label>
                            <a href="#" class="text-[10px] font-bold text-accent hover:underline">Forgot Password?</a>
                        </div>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-muted"></i>
                            <input type="password" placeholder="••••••••" required class="w-full bg-input border border-slate-800 rounded-xl py-3.5 pl-11 pr-4 text-sm focus:outline-none focus:border-accent transition">
                        </div>
                    </div>

                    <div class="flex items-center space-x-3 ml-1">
                        <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-input border-slate-800 text-accent">
                        <label for="remember" class="text-xs text-muted font-medium">Remember me for 30 days</label>
                    </div>

                    <button type="submit" class="w-full bg-accent hover:bg-accent/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-accent/20 transition transform active:scale-[0.98]">
                        Sign In to Assistant
                    </button>
                </form>

                <p class="mt-8 text-sm text-muted">
                    Don't have an account? <a href="signup.html" class="text-accent font-bold hover:underline">Create an account</a>
                </p>
            </div>

            <div class="mt-12 flex space-x-6 text-[10px] font-bold text-muted uppercase tracking-widest">
                <a href="#" class="hover:text-white transition">Terms of Service</a>
                <a href="#" class="hover:text-white transition">Privacy Policy</a>
                <a href="#" class="hover:text-white transition">Contact Support</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
